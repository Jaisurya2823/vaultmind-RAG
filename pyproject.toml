[project]
name = "vaultmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JAISURYA P", email = "jaisurya2823@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "flask>=3.0.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-huggingface>=0.0.3",
    "lxml>=4.9.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-pptx>=0.6.21",
    "sentence-transformers>=3.0.0",
    "unstructured>=0.14.0",
]

[project.scripts]
vaultmind = "vaultmind:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
